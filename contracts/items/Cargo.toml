[package]
name = "oja-items"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Oja items: one NEP-245 multi-token contract holding every item type."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "~5.9"

[dev-dependencies]
near-sdk = { version = "~5.9", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
