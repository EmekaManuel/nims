<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oja — Fast-forward a week</title>
<style>
  :root { --bg:#faf7f0; --fg:#2a2118; --muted:#7a6e60; --card:#fff; --line:#e6dfd0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17130e; --fg:#f2eadb; --muted:#a39682; --card:#211b14; --line:#38301f; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; max-width:960px; margin-inline:auto; }
  h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 8px; } svg { width:100%; height:auto; display:block; }
  ul { margin:0; padding-left:18px; } li { margin:2px 0; } .legend span { margin-right:12px; white-space:nowrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
</style>
</head>
<body>
<h1>Oja — Fast-forward a week</h1>
<p class="sub">Seven in-game days from <code>npm run sim</code>. Dashed lines are shocks; dots on the cash chart mark closures and revivals.</p>
<div id="app" class="card">Loading <code>out/run.json</code>… (serve this folder, e.g. <code>npx serve sim</code>)</div>
<script>
const COLORS = ['#0072B2','#D55E00','#009E73','#CC79A7','#E69F00','#56B4E9','#7a6e60','#000000'];
const W = 900, H = 260, P = { l:48, r:12, t:10, b:24 };
function line(series, hours, ymax) {
  const x = h => P.l + (h / (hours - 1)) * (W - P.l - P.r);
  const y = v => H - P.b - (v / ymax) * (H - P.t - P.b);
  return series.map((s, i) => `<path d="${s.values.map((v,h)=>(h?'L':'M')+x(h).toFixed(1)+' '+y(v).toFixed(1)).join('')}" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="2"/>`).join('');
}
function axes(hours, ymax, shocks) {
  const x = h => P.l + (h / (hours - 1)) * (W - P.l - P.r);
  let s = '';
  for (let d = 0; d <= 7; d++) s += `<text x="${x(Math.min(d*24,hours-1))}" y="${H-6}" font-size="11" fill="currentColor" opacity=".6" text-anchor="middle">Day ${d+1}</text>`;
  for (let t = 0; t <= 4; t++) { const v = ymax*t/4, yy = H-P.b-(v/ymax)*(H-P.t-P.b);
    s += `<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="currentColor" opacity=".12"/><text x="${P.l-6}" y="${yy+4}" font-size="11" fill="currentColor" opacity=".6" text-anchor="end">₦${Math.round(v)}</text>`; }
  for (const e of shocks) s += `<line x1="${x(e.hour)}" x2="${x(e.hour)}" y1="${P.t}" y2="${H-P.b}" stroke="currentColor" opacity=".35" stroke-dasharray="3 3"><title>${e.text}</title></line>`;
  return s;
}
function chart(title, series, hours, ymax, shocks, extra='') {
  const legend = series.map((s,i)=>`<span><i class="dot" style="background:${COLORS[i%COLORS.length]}"></i>${s.name}</span>`).join('');
  return `<div class="card"><h2>${title}</h2><svg viewBox="0 0 ${W} ${H}">${axes(hours,ymax,shocks)}${line(series,hours,ymax)}${extra}</svg><div class="legend">${legend}</div></div>`;
}
fetch('out/run.json').then(r => r.json()).then(run => {
  const hist = run.history, n = hist.length;
  const shocks = run.events.filter(e => e.type === 'shock');
  const keys = [...new Set(hist.flatMap(s => Object.keys(s.prices)))];
  const byMarket = {};
  keys.forEach(k => { const [m] = k.split(':'); (byMarket[m] ||= []).push(k); });
  const names = { produce:'Produce Market', fabric:'Fabric Market', scrap:'Scrap & Hardware' };
  let html = '';
  for (const [m, ks] of Object.entries(byMarket)) {
    const series = ks.map(k => ({ name: k.split(':')[1], values: hist.map(s => s.prices[k] ?? null).map((v,i,a)=>v ?? a[i-1] ?? 0) }));
    html += chart(`${names[m]} — price per item`, series, n, Math.max(...series.flatMap(s => s.values)) * 1.1, shocks);
  }
  const cashSeries = run.merchants.map(m => ({ name: m.name, values: hist.map(s => s.cash[m.id]) }));
  const cmax = Math.max(...cashSeries.flatMap(s => s.values)) * 1.05;
  const x = h => P.l + (h / (n - 1)) * (W - P.l - P.r);
  const marks = run.events.filter(e => e.type === 'revived' || e.text.includes('closed')).map(e =>
    `<circle cx="${x(e.hour)}" cy="${H-P.b}" r="5" fill="${e.type==='revived'?'#009E73':'#D55E00'}"><title>${e.text}</title></circle>`).join('');
  html += chart('Merchant cash', cashSeries, n, cmax, shocks, marks);
  html += `<div class="card"><h2>What happened</h2><ul>${run.events.filter(e=>e.type!=='state' || /closed|reopen/.test(e.text)).map(e=>`<li>Day ${Math.floor(e.hour/24)+1}, ${String(e.hour%24).padStart(2,'0')}:00 — ${e.text}</li>`).join('')}</ul></div>`;
  document.getElementById('app').outerHTML = html;
}).catch(() => {});
</script>
</body>
</html>
